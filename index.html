<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discover Madeira | Luxury Stays & Real Estate</title>
  <style>
    :root {
      --ink: #151513; --charcoal: #20201d; --muted: #706b62; --ivory: #f7f2e8;
      --porcelain: #fbfaf6; --line: #ded5c4; --laurel: #34463a; --gold: #b99a5f;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; color: var(--ink); background: var(--porcelain); font-family: sans-serif; }
    img { display: block; max-width: 100%; }
    a { color: inherit; text-decoration: none; }

    /* HEADER */
    .site-header {
      position: fixed; top: 0; left: 0; right: 0; z-index: 20;
      display: grid; grid-template-columns: auto 1fr auto;
      align-items: center; gap: 24px; padding: 16px 64px;
      background: rgba(21, 21, 19, 0.94); border-bottom: 1px solid rgba(185, 154, 95, 0.34);
    }
    .brand { grid-column: 1; justify-self: start; }
    .logo-image { width: 160px; height: auto; transition: 0.3s; }
    .logo-image:hover { filter: brightness(1.2); transform: scale(1.05); }

    .nav-links { grid-column: 2; justify-self: center; display: flex; gap: 28px; color: #fff; font-size: 14px; font-weight: 680; }

    /* SECTION STAYS */
    .section { padding: 80px 64px; }
    .offer-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
    .offer-card { background: #fff; border: 1px solid #ddd; border-radius: 20px; overflow: hidden; }
    .offer-copy { padding: 20px; }
    .offer-card a { color: var(--laurel); font-weight: 820; display: block; margin-top: 10px; }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="brand">
      <a href="/"><img src="logo.png" alt="PRIMESTAY" class="logo-image"></a>
    </div>
    <nav class="nav-links">
      <a href="#stays">Stays</a>
      <a href="#properties">Properties</a>
      <a href="#contact">Contact</a>
    </nav>
    <div style="grid-column: 3;"></div>
  </header>

  <main style="padding-top: 100px;">
    <section id="stays" class="section">
      <h2>Featured Stays</h2>
      <div class="offer-grid">
        <div class="offer-card">
          <img src="https://images.unsplash.com/photo-1566073771259-6a8506099945?w=600" alt="Villa Aurora">
          <div class="offer-copy">
            <p>FUNCHAL</p>
            <h3>Villa Aurora</h3>
            <span>Experience the ultimate luxury stay in our exclusive villa.</span>
            <a href="villa-aurora.html">View Details →</a>
          </div>
        </div>
        <div class="offer-card">
          <img src="https://images.unsplash.com/photo-1512917774080-9991f1c4c750?w=600" alt="Cliffside Villa">
          <div class="offer-copy">
            <p>CALHETA</p>
            <h3>Cliffside Infinity Villa</h3>
            <a href="#">Check Availability →</a>
          </div>
        </div>
        <div class="offer-card">
          <img src="https://images.unsplash.com/photo-1582719508461-905c673771fd?w=600" alt="Nature Cottage">
          <div class="offer-copy">
            <p>SANTANA</p>
            <h3>Nature Cottage</h3>
            <a href="#">Check Availability →</a>
          </div>
        </div>
      </div>
    </section>
  </main>

</body>
</html>
